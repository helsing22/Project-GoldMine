services:
  - type: web
    name: pizza-mary
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static && node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: HOSTNAME
        value: 0.0.0.0
